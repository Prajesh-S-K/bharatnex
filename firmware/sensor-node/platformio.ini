; PlatformIO project for the Geo-Sentry sensor node.
; See README.md for build/flash instructions -- this environment has no
; physical hardware to actually run this against.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; No external libraries -- WiFi, HTTPClient, Wire, and time.h all ship with
; the ESP32 Arduino core, deliberately kept dependency-free.
