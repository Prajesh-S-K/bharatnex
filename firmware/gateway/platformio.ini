; PlatformIO project for the Geo-Sentry ESP32-S3 gateway.
; See README.md for build/flash instructions -- this environment has no
; physical hardware to actually run this against.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; WiFi, WebServer, and HTTPClient all ship with the ESP32 Arduino core --
; deliberately kept dependency-free, matching ../sensor-node/.
