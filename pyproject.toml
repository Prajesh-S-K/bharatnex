[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["intelligence/models"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests", "intelligence/tests", "automation/tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
