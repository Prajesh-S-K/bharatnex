name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check Python style
        run: ruff check .

      - name: Check Python formatting
        run: ruff format --check .

      - name: Validate shared contracts
        run: python scripts/validate_contracts.py

      - name: Run tests
        run: python -m pytest

      - name: Reject whitespace errors
        run: python scripts/check_whitespace.py

      - name: Scan tracked files for common credential assignments
        shell: bash
        run: |
          matches="$(git grep -nEi '(password|api[_-]?key|secret|token|ssid)[[:space:]]*=[[:space:]]*[^$<{[:space:]]' -- ':!*.example' ':!.github/workflows/*' || true)"
          # Exclude assignments that are clearly dynamic, cryptographically-secure
          # generation calls (not a literal/hardcoded value), e.g. Python's `secrets`
          # module, os.urandom, openssl rand or uuid4.
          suspicious="$(printf '%s\n' "$matches" | grep -viE 'secrets\.(token_urlsafe|token_hex|token_bytes)\(|os\.urandom\(|openssl rand|uuid\.uuid4\(\)' || true)"
          if [[ -n "$suspicious" ]]; then
            echo "$suspicious"
            echo "Potential credential-like assignment found in tracked files."
            exit 1
          fi
